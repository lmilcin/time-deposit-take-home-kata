spring:
  application:
    name: time-deposit
  # Connection details must be supplied via environment variables (no defaults).
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/migration

server:
  # GET /time-deposits can return very large, highly compressible JSON; compression is applied
  # on the fly while the response is streamed.
  compression:
    enabled: true
    mime-types: application/json

springdoc:
  swagger-ui:
    # Swagger UI renders the hand-written contract served as a static resource.
    url: /openapi.yaml

time-deposits:
  # Number of time deposits fetched and updated per database round trip.
  batch-size: 1000
