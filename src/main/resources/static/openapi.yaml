openapi: 3.0.3
info:
  title: XA Bank Time Deposit API
  description: API for retrieving time deposits and applying monthly interest to their balances.
  version: 1.0.0
servers:
  - url: /
tags:
  - name: TimeDeposits
    description: Time deposit operations
paths:
  /time-deposits:
    get:
      tags: [TimeDeposits]
      operationId: getTimeDeposits
      summary: Retrieve all time deposits
      description: >-
        Returns all time deposits with their withdrawals, ordered by `id` ascending.
        An interrupted fetch can be resumed by passing the `id` of the last received
        time deposit as `afterId`.
      parameters:
        - name: afterId
          in: query
          required: false
          description: >-
            Return only time deposits with an `id` greater than this value (exclusive).
            Omit to fetch from the beginning.
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Time deposits with their withdrawals, ordered by `id` ascending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeDepositList'
  /time-deposits/calculate-interest:
    post:
      tags: [TimeDeposits]
      operationId: calculateInterest
      summary: Apply monthly interest to the balances of all time deposits
      description: >-
        Applies interest to the balance of every time deposit based on its current `days`,
        then advances `days` of every time deposit by one.
      responses:
        '204':
          description: Balances and days of all time deposits were updated
components:
  schemas:
    TimeDepositList:
      description: Time deposits ordered by `id` ascending.
      type: array
      items:
        $ref: '#/components/schemas/TimeDeposit'
    TimeDeposit:
      type: object
      required: [id, planType, balance, days, withdrawals]
      properties:
        id:
          type: integer
          format: int32
          example: 1
        planType:
          type: string
          example: basic
        balance:
          type: number
          format: double
          example: 1234567.00
        days:
          description: Number of days the deposit has existed, counting the day it was made (starting at 1).
          type: integer
          format: int32
          example: 45
        withdrawals:
          type: array
          items:
            $ref: '#/components/schemas/Withdrawal'
    Withdrawal:
      type: object
      required: [id, amount, date]
      properties:
        id:
          type: integer
          format: int32
          example: 1
        amount:
          type: number
          format: double
          example: 100.00
        date:
          type: string
          format: date
          example: '2026-01-15'
