openapi: 3.0.3
info:
  title: XA Bank Time Deposit API
  description: API for retrieving time deposits and applying monthly interest to their balances.
  version: 1.0.0
servers:
  - url: /
tags:
  - name: TimeDeposits
    description: Time deposit operations
paths:
  /time-deposits:
    get:
      tags: [TimeDeposits]
      operationId: getTimeDeposits
      summary: Retrieve all time deposits
      responses:
        '200':
          description: List of all time deposits with their withdrawals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeDepositList'
  /time-deposits/calculate-interest:
    post:
      tags: [TimeDeposits]
      operationId: calculateInterest
      summary: Apply monthly interest to the balances of all time deposits
      responses:
        '204':
          description: Balances of all time deposits were updated
components:
  schemas:
    TimeDepositList:
      type: array
      items:
        $ref: '#/components/schemas/TimeDeposit'
    TimeDeposit:
      type: object
      required: [id, planType, balance, days, withdrawals]
      properties:
        id:
          type: integer
          format: int32
          example: 1
        planType:
          type: string
          example: basic
        balance:
          type: number
          format: double
          example: 1234567.00
        days:
          type: integer
          format: int32
          example: 45
        withdrawals:
          type: array
          items:
            $ref: '#/components/schemas/Withdrawal'
    Withdrawal:
      type: object
      required: [id, amount, date]
      properties:
        id:
          type: integer
          format: int32
          example: 1
        amount:
          type: number
          format: double
          example: 100.00
        date:
          type: string
          format: date
          example: '2026-01-15'
