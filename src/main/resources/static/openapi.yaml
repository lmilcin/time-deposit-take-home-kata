openapi: 3.0.3
info:
  title: XA Bank Time Deposit API
  description: API for retrieving time deposits and applying monthly interest to their balances.
  version: 1.0.0
servers:
  - url: /
tags:
  - name: TimeDeposits
    description: Time deposit operations
paths:
  /time-deposits:
    get:
      tags: [TimeDeposits]
      operationId: getTimeDeposits
      summary: Retrieve all time deposits
      description: >-
        Returns all time deposits with their withdrawals, ordered by `id` ascending.
        An interrupted fetch can be resumed by passing the `id` of the last received
        time deposit as `afterId`.
      parameters:
        - name: afterId
          in: query
          required: false
          description: >-
            Return only time deposits with an `id` greater than this value (exclusive).
            Omit to fetch from the beginning.
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Time deposits with their withdrawals, ordered by `id` ascending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeDepositList'
  /time-deposits/calculate-interest:
    post:
      tags: [TimeDeposits]
      operationId: calculateInterest
      summary: Run the daily interest batch for an accounting date
      description: >-
        Intended to run once per accounting date (daily), since time deposits are made on different
        days of the month. Monthly interest is calculated individually for each time deposit as
        defined by its plan: interest is not accrued for the first 30 days (basic, student) or
        45 days (premium), and is then due every calendar month on the monthly anniversary of the
        accrual start. For each deposit where it is due, interest is applied and the accounting date
        is recorded as the date interest was last applied. Afterwards `days` of every time deposit
        advances by one. The process fails if any time deposit has an unknown plan type.


        Runs must be for consecutive accounting dates: a new run is only accepted for the day after the
        latest completed run. A run that did not complete (e.g. it failed or was interrupted) must be
        resumed by calling this again with the same accounting date; it continues after the last committed
        batch, so every time deposit is processed exactly once per accounting date. Only one run can make
        progress at a time.
      parameters:
        - name: accounting_date
          in: query
          required: true
          description: >-
            Accounting date the batch is executed for. It may differ from the current calendar date,
            e.g. when the batch runs after midnight, in a different time zone or is delayed by an outage.
          schema:
            type: string
            format: date
      responses:
        '204':
          description: Interest batch completed for the accounting date
        '400':
          description: accounting_date is missing or not a valid date
        '409':
          description: >-
            The accounting date is neither the day after the latest completed run nor the date of a run
            that has not completed, or another run progressed concurrently. Nothing is calculated.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Interest batch failed, e.g. a time deposit has an unknown plan type
components:
  schemas:
    Problem:
      description: Error details (RFC 9457).
      type: object
      required: [title, status, detail]
      properties:
        title:
          type: string
          example: Conflict
        status:
          type: integer
          format: int32
          example: 409
        detail:
          type: string
          example: >-
            Interest calculation for 2026-03-11 is not allowed: the latest run, for 2026-03-09, is completed.
            The next run must be for 2026-03-10.
    TimeDepositList:
      description: Time deposits ordered by `id` ascending.
      type: array
      items:
        $ref: '#/components/schemas/TimeDeposit'
    TimeDeposit:
      type: object
      required: [id, planType, balance, days, withdrawals]
      properties:
        id:
          type: integer
          format: int32
          example: 1
        planType:
          type: string
          example: basic
        balance:
          type: number
          format: double
          example: 1234567.00
        days:
          description: Number of days the deposit has existed, counting the day it was made (starting at 1).
          type: integer
          format: int32
          example: 45
        withdrawals:
          type: array
          items:
            $ref: '#/components/schemas/Withdrawal'
    Withdrawal:
      type: object
      required: [id, amount, date]
      properties:
        id:
          type: integer
          format: int32
          example: 1
        amount:
          type: number
          format: double
          example: 100.00
        date:
          type: string
          format: date
          example: '2026-01-15'
